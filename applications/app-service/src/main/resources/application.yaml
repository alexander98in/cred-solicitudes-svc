server:
  port: 8081
spring:
  application:
    name: "cred-solicitud-svc"
  devtools:
    add-properties: false
  jackson:
    parser:
      STRICT_DUPLICATE_DETECTION: true
  profiles:
    include: null
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password:  ${SPRING_R2DBC_PASSWORD}
  sql.init.mode: "never"
  messages:
    basename: i18n/validation-messages
    encoding: UTF-8
    fallback-to-system-locale: false

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "pragma_credi"
    schema: "public"
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  level:
    co.com.pragma.solicitud.api: DEBUG

clients:
  user-service:
    base-url: http://localhost:8080

security:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_DEV}
    ttl-seconds: 3600

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:dummy}
  secret-key: ${AWS_SECRET_ACCESS_KEY:dummy}
  sqs:
    queue-url: ${AWS_SQS_QUEUE_NOTIFICATION_URL:dummy}

outbox:
  poll-interval-ms: 30000
  batch-size: 50
  max-retries: 10
  parallelism: 5